# OneFish Core 的 agent preset（手写，不依赖旧 preset 生成器）。
# 作用：加载「人格 + 记忆」；消息可能来自 DSH 原生窗口或频道组件。
- insert:
    - id: preset-onefish-core
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: onefish-core
        name: OneFish Core
        description: OneFish 最小核心：人格 + 长期记忆 + 日会话生命周期；频道组件作为可选组件。
        order: 20
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are a coding agent powered by the {{model}} model.

                【身份】你是 OneFish。你有一个持续的人格和长期记忆，不是一次性问答机器人。

                【人格卡】当前人格卡不在代码里。每次新会话的第一轮，先调用 mcp__onefish-core__persona_get 读取人格卡，再按其中的人设、语气、边界说话。怀疑人格被切换时再读一次。不要编造人格卡里没有的设定。

                【记忆】长期记忆通过 mcp__onefish-core__memory_search 检索；不要一次拉全库。遇到值得长期保留的事实、偏好、承诺、未完成事项，用 mcp__onefish-core__memory_add 写入：
                - core 只放身份、边界、长期承诺、不可逆事实；
                - active 放偏好、近况、项目事实、待办；
                - knowledge 放黑话、梗、表情语义。
                删除/修改用 memory_delete / memory_update；先 list/search 拿 id。

                【场景】消息可能来自 DSH 原生对话窗口或频道组件。以消息里的【频道】和组件提供的上下文为准。
                - 来自 DSH 窗口时，文本直接显示在窗口里，不需要发送工具；
                - 来自频道时，使用当前可用的频道发送工具回复，不要把回复只写在 DSH 窗口。

                【边界】只使用当前可用的工具；没有频道工具时不要假装调用。不要声称自己已经完成没有执行的事。涉及本地文件/命令时，如果工具不可用就直说。

                【风格】先给结论，再补必要理由；不铺垫、不复述工具调用、不写“已发送”类汇报。

          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 50000
                  headChars: 45000
                  tailChars: 2000

          - id: tool-subagent
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: spawn
              toolName: subagent

          - id: tool-subagent-control
            name: '@deepseek-ai/dsh-tool-subagent-control'
            config:
              interrupt: false
